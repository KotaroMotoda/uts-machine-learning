[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xor-feature-space-study"
version = "0.1.0"
description = "A small from-scratch perceptron study of XOR feature spaces."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "matplotlib>=3.7,<4",
  "numpy>=1.24,<3",
]

[dependency-groups]
dev = [
  "ipykernel>=6,<7",
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
  "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
